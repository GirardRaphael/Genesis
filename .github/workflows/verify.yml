name: Verify logistics application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m ruff check services tests scripts
      - run: npm ci
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: npm ci
        working-directory: qa
      - run: npx playwright install --with-deps chromium
        working-directory: qa
      - name: Start deterministic local profile
        run: |
          python -m genesis.worker --seed-demo
          python -m uvicorn genesis.api:app --host 127.0.0.1 --port 8000 > /tmp/genesis-api.log 2>&1 &
          python -m genesis.worker > /tmp/genesis-worker.log 2>&1 &
          cd apps/web
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 5173 --strictPort > /tmp/genesis-web.log 2>&1 &
      - name: Wait for local profile
        run: |
          python -c "import time,httpx; time.sleep(4); httpx.get('http://127.0.0.1:8000/api/v1/scenarios').raise_for_status(); httpx.get('http://127.0.0.1:5173').raise_for_status()"
      - run: npm test
        working-directory: qa
